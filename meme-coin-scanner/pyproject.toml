[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-coin-scanner"
version = "0.1.0"
description = "Scans DEX pairs (via DexScreener + GoPlus) for meme coin momentum and rug-pull risk signals"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
